[project]
name = "darkdiff"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "diffusers>=0.42.0",
    "gdown>=6.4.2",
    "lpips>=0.1.4",
    "numpy>=2.5.4",
    "rawpy>=0.27.1",
    "requests>=2.34.2",
    "torch>=2.11.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.26.0",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
